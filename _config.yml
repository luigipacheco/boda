# Angela & Luis — wedding site
# Edit the values below; everything on the site reads from here.

title: Angela & Luis
description: Boda de Angela y Luis Pacheco — León, Guanajuato
url: "https://luigipacheco.github.io"
baseurl: "/boda"          # change to "" when a custom domain is set
lang: es

couple:
  bride: Angela
  groom: Luis Pacheco
  short: Angela & Luis

wedding:
  date: "2027-07-24"                    # ISO, used by the countdown
  date_es: "Sábado 24 de julio de 2027"
  date_en: "Saturday, July 24, 2027"
  city: León, Guanajuato
  rsvp_deadline_es: "31 de diciembre de 2026"
  rsvp_deadline_en: "December 31, 2026"
  dress_code_es: "Formal"
  dress_code_en: "Formal"

ceremony:
  name: Templo Expiatorio del Sagrado Corazón de Jesús
  time: "19:00"
  address: "Calle Francisco I. Madero 721, Centro, 37000 León, Gto."   # TODO: verify
  maps_query: "Templo Expiatorio del Sagrado Corazón de Jesús, León, Guanajuato"

reception:
  name: Ex Hacienda Cruz de Cantera
  time: "20:30"
  address: "Malecón del Río de los Gómez 760, La Mora, León, Gto."   # TODO: verify with the venue
  maps_query: "Ex Hacienda Cruz de Cantera, León, Guanajuato"

# RSVP backend: paste the Apps Script web-app URL here (see tools/apps-script/README.md).
# Leave empty while testing; the form shows a "coming soon" notice.
rsvp_endpoint: ""

# Contact shown on the RSVP page for people who can't find their name
contact_email: luigipach@gmail.com
contact_whatsapp: ""                     # e.g. "5214771234567" (country code, no plus sign)

plugins:
  - jekyll-seo-tag

markdown: kramdown
kramdown:
  input: GFM

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - tools/
  - vendor/
