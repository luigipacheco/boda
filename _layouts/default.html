<!DOCTYPE html>
<html lang="es" data-lang="es">
  {% include head.html %}
  <body>
    {% include header.html %}
    <main class="page {{ page.class }}">
      {{ content }}
    </main>
    {% include footer.html %}
    <script src="{{ '/assets/js/lang.js' | relative_url }}"></script>
    {% if page.scripts %}{% for s in page.scripts %}
    <script src="{{ s | relative_url }}"></script>
    {% endfor %}{% endif %}
  </body>
</html>
